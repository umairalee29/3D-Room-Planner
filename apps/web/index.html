<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Room Planner</title>
  </head>
  <body class="h-screen flex flex-col bg-slate-100 text-slate-800">
    <header
      class="h-12 shrink-0 flex items-center px-4 bg-slate-900 text-white font-semibold"
    >
      3D Room Planner
    </header>
    <div class="flex flex-1 min-h-0">
      <aside
        id="catalog-panel"
        class="w-48 shrink-0 bg-white border-r border-slate-200 p-4 overflow-y-auto"
        aria-label="Furniture Catalog"
      ></aside>
      <main
        id="viewport"
        class="flex-1 min-h-0 relative"
        aria-label="3D view of the room"
      ></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
